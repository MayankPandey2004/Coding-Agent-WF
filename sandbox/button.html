<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Button Component</title>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Inter:wght@500&display=swap');
    .figma-button {
      display: inline-block;
      font-family: 'Inter', sans-serif;
      font-weight: 500;
      font-size: 14px;
      line-height: 1;
      color: #FFFFFF; /* text color from design */
      background-color: #007BFF; /* assumed primary button color */
      padding: 12px 24px; /* approximate to match text size and typical button */
      border: none;
      border-radius: 4px; /* assumed corner radius */
      text-align: center;
      cursor: pointer;
    }
    .figma-button:hover {
      background-color: #0069d9;
    }
  </style>
</head>
<body>
  <button class="figma-button">Click Me</button>
</body>
</html>
